    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'pixel': ['"VT323"', 'monospace'],
            },
            colors: {
              'balatro-bg': '#313131',
              'balatro-blue': '#009dff',
              'balatro-red': '#fe3e3e',
              'balatro-orange': '#ff9f00',
              'balatro-gold': '#eab308',
              'balatro-dark': '#1a1a1a',
              'balatro-panel': '#2f2f2f',
            },
            animation: {
              'swirl': 'swirl 20s linear infinite',
              'crt-flicker': 'flicker 0.15s infinite',
              'card-float': 'float 3s ease-in-out infinite',
              'deal': 'deal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards',
              'card-slam': 'slam 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'pulse-glow': 'pulseGlow 2s infinite',
            },
            keyframes: {
              swirl: {
                '0%': { backgroundPosition: '0% 0%' },
                '100%': { backgroundPosition: '100% 100%' },
              },
              flicker: {
                '0%': { opacity: '0.97' },
                '50%': { opacity: '1' },
                '100%': { opacity: '0.98' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              },
              deal: {
                '0%': { transform: 'translateY(120%) scale(0.5) rotate(-10deg)', opacity: '0' },
                '100%': { transform: 'translateY(0) scale(1) rotate(0deg)', opacity: '1' }
              },
              slam: {
                '0%': { opacity: '0', transform: 'scale(1.8) translateY(-50px)' },
                '60%': { opacity: '1', transform: 'scale(0.95) translateY(5px)' },
                '80%': { transform: 'scale(1.02) translateY(-2px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
              },
              pulseGlow: {
                '0%, 100%': { boxShadow: '0 0 10px rgba(234, 179, 8, 0.5)' },
                '50%': { boxShadow: '0 0 25px rgba(234, 179, 8, 0.9)' }
              }
            }
          }
        }
      }
    </script>
